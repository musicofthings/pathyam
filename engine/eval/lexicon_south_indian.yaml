# Pathyam — South Indian dish lexicon (DRAFT)
#
# 50 dishes across Tamil Nadu, Kerala, Karnataka and Andhra/Telangana, with native
# script and the romanisations people actually type.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ THIS FILE NEEDS NATIVE-SPEAKER REVIEW BEFORE IT IS TRUSTED.
#
# The native-script forms and romanisations here are a careful first draft, not an
# authority. Specific things a reviewer should check:
#   · Malayalam and Telugu forms are the least certain of the four.
#   · Regional spellings differ (Kongu vs Chettinad Tamil; Malabar vs Travancore).
#   · Several dishes have genuinely contested names across states — bisi bele bath
#     is Karnataka-only, sambar sadam is its rough Tamil analogue, and they are NOT
#     the same dish. They are listed separately on purpose.
#   · `aliases` should grow, not shrink: every extra spelling is free recall.
#
# Used for two things: the evaluation harness in ../pathyam_engine/evaluation/, and
# as the seed of the Phase 1 production lexicon (loadable into ref.food_name).
# ─────────────────────────────────────────────────────────────────────────────
#
# Schema per entry:
#   key:            stable identifier used by the golden query set
#   en:             canonical English name
#   group:          food group
#   regions:        states where the dish is common (TN/KL/KA/AP/TG)
#   ta/te/ml/kn:    native script name (omit where the dish is not native)
#   aliases:        romanisations and colloquial forms, any language
#   has_template:   whether a computable recipe template is expected to exist

