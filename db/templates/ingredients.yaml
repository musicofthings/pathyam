# Pathyam — ingredient registry
#
# Every ingredient a template can reference, keyed by a stable slug. This file
# defines IDENTITY only — name, food group, ontology codes, physical properties.
#
# ─────────────────────────────────────────────────────────────────────────────
# IT DELIBERATELY CONTAINS NO NUTRIENT VALUES.
#
# Composition comes from ICMR-NIN IFCT 2017 once that licence is cleared (see the
# dossier, risk R1). Inventing plausible-looking numbers here to make the pipeline
# run would produce a database that computes confidently and is wrong — the exact
# failure this project exists to avoid, and unrecoverable once anyone starts
# trusting the output.
#
# Instead, `python -m pathyam_engine.authoring audit` reports which templates are
# blocked and on which ingredients. That report IS the IFCT extraction worklist.
# ─────────────────────────────────────────────────────────────────────────────
#
# Fields:
#   key            stable slug referenced by templates
#   en             canonical English name
#   group          food group; drives retention and yield factor lookup
#   ifct_code      IFCT 2017 food code where known — the extraction key
#   density        g/ml, needed for the volume -> mass path
#   edible_pct     edible portion, where less than 100
#   foodon         FoodOn IRI fragment, where mapped

